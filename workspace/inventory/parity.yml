    classification: DSH_EXTENDED
    watch_extension: watch-source-collections-and-privacy-scope

  - id: client.ui-brand-official
    package: "@deepseek-ai/dsh-client-ui-brand-official"
    status: intentionally_replaced
    classification: DSH_EXTENDED
    adr: docs/adr/ADR-001-dsh-foundation.md
    replaced_by: "@deepwatch/dsh-brand"
    note: >-
      The only intentional replacement in the register. Attribution and MIT
      notices remain mandatory and visible; the DeepSeek name is not used in
      the product name and its marks are not shipped.

  # ── conversation and tools ───────────────────────────────────────────────
  - id: client.ui-conversation
    package: "@deepseek-ai/dsh-client-ui-conversation"
    status: extended
    classification: DSH_EXTENDED
    watch_extension: watch-evidence-citations-and-verification-split
    note: >-
      Queue, steer and stop are preserved unchanged. Watch adds evidence
