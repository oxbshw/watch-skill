  - id: client.ui-tool
    package: "@deepseek-ai/dsh-client-ui-tool"
    status: extended
    classification: DSH_EXTENDED
    watch_extension: watch-tool-receipt-renderers

  - id: client.ui-renderer-trajectory
    package: "@deepseek-ai/dsh-client-ui-trajectory"
    status: extended
    classification: DSH_EXTENDED
    watch_extension: watch-event-definitions
    note: >-
      Trajectory stays the primary per-session tracking system. Watch adds
      media, evidence, action and verdict records plus deep links through the
      existing event definitions; it does not build a second ledger.

  - id: client.ui-workflow-run
