# DSH parity register — one decision per official product capability.
#
# The rule this file exists to enforce: no DeepSeek Harness capability may
# disappear from the Watch distribution silently. `scripts/verify-parity.mjs`
# cross-checks every non-private client product package in inventory/packages.json
# against this register and fails on anything unclassified, so an upstream bump
# that adds a package cannot pass CI until someone decides what Watch does with it.
#
# status values:
#   preserved              inherited unchanged; a golden journey protects it
#   extended               inherited, with Watch behavior added through a seam
#   intentionally_replaced replaced on purpose; `adr` is mandatory
#   not_applicable         does not apply to this distribution; `reason` mandatory
#
# classification values (product plan §5.4):
#   DSH_EXISTING   inherited capability whose parity we protect
#   DSH_EXTENDED   inherited capability we add Watch behavior to
#   WATCH_EXISTING capability already proven in Watch Core, surfaced via plugins
#   WATCH_NEW      new to both sides
#   DEFERRED       not required for the first product slice

baseline:
  repository: https://github.com/deepseek-ai/deepseek-harness
  commit: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  version: 0.1.1-rc.2

capabilities:
  # ── client foundation ────────────────────────────────────────────────────
  - id: client.connection
    package: "@deepseek-ai/dsh-client-connection"
    status: preserved
    classification: DSH_EXISTING
    note: >-
      Reconnect and dual-stream semantics are load-bearing for Watch evidence
      recovery; Watch adds no behavior here and depends on it staying intact.

  - id: client.runtime
    package: "@deepseek-ai/dsh-client-runtime"
    status: preserved
    classification: DSH_EXISTING

  - id: client.modules
    package: "@deepseek-ai/dsh-client-modules"
    status: preserved
    classification: DSH_EXISTING
    note: The dsh.client scan is how Watch client halves reach the browser.

  - id: client.web
    package: "@deepseek-ai/dsh-client-web"
    status: preserved
    classification: DSH_EXISTING

  - id: client.hmr
    package: "@deepseek-ai/dsh-client-hmr"
    status: preserved
    classification: DSH_EXISTING
    note: Development only; disabled in the web-app bundle at this baseline.

  - id: client.locale
    package: "@deepseek-ai/dsh-client-locale"
    status: extended
    classification: DSH_EXTENDED
    watch_extension: watch-locale-namespaces-and-rtl
    note: >-
      Watch registers its own namespaces and holds Arabic RTL as a technical
      release gate. UI locale stays independent of source and response language.

  - id: client.ui-slots
    package: "@deepseek-ai/dsh-client-ui-slots"
    status: preserved
    classification: DSH_EXISTING
    note: The 44 slots in inventory/slots.json are Watch's entire UI seam.

  - id: client.ui-primitives
    package: "@deepseek-ai/dsh-client-ui-primitives"
    status: preserved
    classification: DSH_EXISTING

  - id: client.ui-theme
    package: "@deepseek-ai/dsh-client-ui-theme"
    status: extended
    classification: DSH_EXTENDED
    watch_extension: watch-brand-tokens
    note: >-
      Watch brand ships as semantic tokens over the existing theme runtime.
      Green is reserved for VERIFIED; feature packages carry no raw hex.

  - id: client.ui-renderer
    package: "@deepseek-ai/dsh-client-ui-renderer"
    status: preserved
    classification: DSH_EXISTING

  # ── shell and navigation ─────────────────────────────────────────────────
  - id: client.ui-layout
    package: "@deepseek-ai/dsh-client-ui-layout"
    status: extended
    classification: DSH_EXTENDED
    watch_extension: watch-inspector-and-timeline
    note: Right inspector and bottom timeline mount into the existing regions.

  - id: client.ui-sidebar
    package: "@deepseek-ai/dsh-client-ui-sidebar"
    status: extended
    classification: DSH_EXTENDED
    watch_extension: watch-modes-live-memory-library

  - id: client.ui-workspace
    package: "@deepseek-ai/dsh-client-ui-workspace"
