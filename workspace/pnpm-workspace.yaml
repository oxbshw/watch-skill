packages:
  - packages/watch/*
  - apps/*

# The DSH baseline is consumed as published packages pinned to one exact
# version. Every Watch package spells that version through this catalog, so a
# bump is one edit and `upstream/deepseek-harness.lock` stays the single
# statement of what this distribution is built against.
catalog:
  "@deepseek-ai/dsh": 0.1.1-rc.2
  "@deepseek-ai/dsh-base": 0.1.1-rc.2
  "@deepseek-ai/dsh-web-app": 0.1.1-rc.2
  "@deepseek-ai/dsh-brand": 0.1.1-rc.2
  "@deepseek-ai/dsh-invariants": 0.1.1-rc.2
  "@deepseek-ai/dsh-typert-protocol": 0.1.1-rc.2
  "@deepseek-ai/dsh-typert-generator": 0.1.1-rc.2
  "@deepseek-ai/dsh-api-remotes": 0.1.1-rc.2
  "@deepseek-ai/dsh-client-runtime": 0.1.1-rc.2
  "@deepseek-ai/dsh-client-locale": 0.1.1-rc.2
  "@deepseek-ai/dsh-client-ui-slots": 0.1.1-rc.2
  "@deepseek-ai/dsh-client-ui-settings": 0.1.1-rc.2
  "@deepseek-ai/dsh-client-ui-primitives": 0.1.1-rc.2
  "@deepseek-ai/dsh-tools": 0.1.1-rc.2
  "@deepseek-ai/dsh-system-prompt": 0.1.1-rc.2
  "@deepseek-ai/cordis": 4.0.1
