# The exact DeepSeek Harness baseline this distribution is built against.
#
# Production resolution never uses `main`, `latest`, or a loose semver range.
# Every Watch package pins DSH peer dependencies to `version` below, and the
# audit tooling reads `commit` to check out the matching source tree.
#
# Changing any field here is an upstream bump: it requires a regenerated
# inventory, a refreshed parity register, and a passing golden-journey run
# before it may be merged. See docs/adr/ADR-001-dsh-foundation.md.

repository: https://github.com/deepseek-ai/deepseek-harness
tag: dsh-v0.1.1-rc.2
commit: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
version: 0.1.1-rc.2
reviewed_at: 2026-08-26
compatibility_profile: watch-workspace-v1

# npm is the distribution channel: every `@deepseek-ai/dsh-*` package in the
# baseline is published at `version`, so Watch consumes DSH as a dependency
# rather than as a fork. The checkout under upstream/deepseek-harness/ exists
# only for source audit, inventory generation, and parity diffing.
registry: https://registry.npmjs.org
cli_package: "@deepseek-ai/dsh"

# Patch budget. A direct upstream patch is only permitted when no extension
# seam exists; each one needs a failing test, an ADR, and a removal plan.
patches:
  applied: []
  budget: 0
