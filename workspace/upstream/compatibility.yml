# What this DeepWatch release claims to be compatible with.
#
# Published verbatim in release notes. A claim that is not backed by a green
# gate in tests/ is not allowed to appear here.

deepwatch:
  version: 0.1.0-preview.0
  channel: preview

deepseek_harness:
  # Exact, not a range: see upstream/deepseek-harness.lock.
  pinned: 0.1.1-rc.2
  # Versions a compatibility gate has actually been run against.
  verified: []

watch_core:
  # The Python engine (oxbshw/watch-skill) this distribution speaks to.
  package: watch-skill
  min: 1.3.0rc2
  max: null
  # The Watch Bridge protocol range this Workspace negotiates.
  protocol_min: 1
  protocol_max: 1

node:
  # Inherited from the DSH root engines field at the pinned commit.
  engines: "^22.19.0 || >=24.0.0"

electron:
  # Desktop is Phase 5; no line is claimed until it ships a signed artifact.
  line: null
