name: Install

# The installers used to carry a "written on Windows, unverified elsewhere"
# disclaimer. This workflow is what replaced it: every push runs the real
# scripts on a clean runner for each OS we claim to support.

on:
  # No path filter on main. A first attempt watched only scripts/ and
  # pyproject.toml, and then the fix that made the installer work on Linux
  # and macOS landed in src/watch_skill/health/ — so the run that would have
  # proved it never fired. What the installer does depends on the engine it
  # installs, so the whole tree is the trigger.
  push:
    branches: [main]
  # No path filter here either, and for the reason stated above plus one
  # more: this workflow now builds and smokes the candidate wheel, and the
  # wheel is built from the whole tree. A filter naming scripts/ and
  # pyproject.toml would skip the candidate smoke for exactly the changes
  # most likely to break it -- an engine edit under src/watch_skill/.
  pull_request:
  schedule:
    # Installers break from the outside — a new uv, a moved ffmpeg package.
    # Catch that on a Monday, not from a bug report.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege, stated rather than inherited. The repository default is
# read today, so this changes nothing now -- it is what keeps a future
# change to that default from silently handing this workflow write access.
# Two runs of one workflow may only cancel each other when they are the same
# kind of run for the same thing, and never on a release branch.
#
# This was one line, `${{ github.workflow }}-${{ github.ref }}`, with
# `cancel-in-progress: true`. For a branch push and a `workflow_dispatch` on
# that same branch `github.ref` is identical, so both landed in one group and
# the later run killed the earlier one. On 2026-09-03 a dispatch created at
# 11:48:51 cancelled the push run created at 11:48:33 for the same commit:
# eight release-critical jobs went to `cancelled` mid-flight and
# `workspace-required` failed, correctly, on dependencies that never finished.
# The pull_request run survived only because its ref is `refs/pull/N/merge`.
#
# `github.event_name` in the group keeps the three kinds apart. The guard
# below then removes automatic cancellation entirely on a release branch,
# where a half-finished matrix is not evidence and a queued one costs only
# time. Manual cancellation is unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ !startsWith(github.ref, 'refs/heads/release/')
        && !startsWith(github.head_ref, 'release/') }}

permissions:
  contents: read

jobs:
  posix:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Lint the script
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh

      # Run against the checked-out copy rather than curl-ing main, so a PR
      # tests its own changes.
      - name: Run the installer
        run: sh scripts/install.sh
        env:
          WATCHSKILL_HOME: ${{ runner.temp }}/watch-skill
          WATCHSKILL_INSTALL_REF: ${{ github.sha }}
          WATCHSKILL_INSTALL_LOCAL: "1"

      - name: The CLI must exist and report its version
        run: |
          cd "${{ runner.temp }}/watch-skill"
          uv run watch-skill --version
          uv run watch-skill --help > /dev/null

      # `|| true` matters: the step runs under `bash -e`, so a failing doctor
      # would abort before the report it just wrote could be printed — which
      # hides the one thing worth seeing.
      - name: Doctor must not fail
        run: |
          cd "${{ runner.temp }}/watch-skill"
          uv run watch-skill doctor --json > doctor.json || true
          cat doctor.json
          python - <<'EOF'
          import json, sys
          report = json.load(open("doctor.json"))
          for check in report["checks"]:
              if check["status"] == "fail":
                  print(f"::error::doctor {check['name']}: {check['message']}")
          sys.exit(0 if report["ok"] else 1)
          EOF

      # `timeout` is GNU coreutils and is not on macOS by default, so the
      # bound is enforced in the shell instead of by an absent binary.
      - name: MCP server must start and answer a handshake
        run: |
          cd "${{ runner.temp }}/watch-skill"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | uv run watch-skill serve > handshake.txt 2>server.log &
          server=$!
          for _ in $(seq 1 90); do
            grep -q '"result"' handshake.txt && break
            kill -0 "$server" 2>/dev/null || break
            sleep 1
          done
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          cat server.log
          grep -q '"result"' handshake.txt

  windows:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the installer
        shell: pwsh
        run: ./scripts/install.ps1
        env:
          WATCHSKILL_HOME: ${{ runner.temp }}\watch-skill
          WATCHSKILL_INSTALL_REF: ${{ github.sha }}
          WATCHSKILL_INSTALL_LOCAL: "1"

      - name: The CLI must exist and report its version
        shell: pwsh
        run: |
          Set-Location "${{ runner.temp }}\watch-skill"
          uv run watch-skill --version
          uv run watch-skill --help | Out-Null

      - name: Doctor must not fail
        shell: pwsh
        run: |
          Set-Location "${{ runner.temp }}\watch-skill"
          uv run watch-skill doctor --json | Out-File -Encoding utf8 doctor.json
          Get-Content doctor.json
          $report = Get-Content doctor.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { exit 1 }

  # Proves the claim the README makes about zero-install usage, against the
  # wheel *this commit* builds.
  #
  # The published equivalent — `uvx --from "watch-skill[standard]"`, resolving
  # from PyPI — used to live here behind
  # `if: schedule || workflow_dispatch`, which meant it was permanently
  # skipped on every pull request. There is nothing on PyPI for a candidate to
  # resolve to, so the job could not have passed; it sat grey in the check list
  # beside jobs that ran, which is how a reader learns to stop reading grey.
  # It now lives in `post-publish.yml`, where it runs when there is something
  # published to verify.
  #
  # What a pre-publication run can honestly assert is that the artifact this
  # commit produces installs and runs the same way, so that is what this does.
  uvx-candidate:
    name: uvx from the candidate wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build the candidate wheel
        run: uv build --wheel --out-dir "${{ runner.temp }}/candidate"

      # Run from outside the checkout. Inside it, `src/watch_skill` is
      # importable and a broken wheel would still appear to work — which is
      # the failure this job exists to make impossible.
      - name: uvx runs the candidate, and it is the candidate that runs
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          wheel=$(find "${{ runner.temp }}/candidate" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          echo "candidate: $wheel"

          declared=$(grep -m1 '^version' "$GITHUB_WORKSPACE/pyproject.toml" | sed -E 's/.*"(.*)".*/\1/')
          echo "pyproject declares: $declared"

          reported=$(uvx --from "$wheel" watch-skill --version)
          echo "wheel reports:      $reported"
          test "$reported" = "$declared"

      - name: The candidate carries the Bridge surface and a doctor
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          wheel=$(find "${{ runner.temp }}/candidate" -maxdepth 1 -name '*.whl' -print -quit)
          uvx --from "$wheel" watch-skill bridge --help > bridge-help.txt
          grep -qi "bridge" bridge-help.txt
          uvx --from "$wheel" watch-skill --help > help.txt
          grep -qi "doctor" help.txt

      # The origin check, stated as a fact rather than inferred from the
      # working directory: the module that answers must live inside the
      # installed artifact, not in the repository this job checked out.
      - name: Execution resolves from the artifact, not the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          wheel=$(find "${{ runner.temp }}/candidate" -maxdepth 1 -name '*.whl' -print -quit)
          uv venv "${{ runner.temp }}/origin-check"
          uv pip install --python "${{ runner.temp }}/origin-check" --quiet "$wheel"
          if [ -x "${{ runner.temp }}/origin-check/bin/python" ]; then
            py="${{ runner.temp }}/origin-check/bin/python"
          else
            py="${{ runner.temp }}/origin-check/Scripts/python.exe"
          fi
          origin=$("$py" -c "import watch_skill, pathlib; print(pathlib.Path(watch_skill.__file__).resolve())")
          echo "watch_skill resolved from: $origin"
          case "$origin" in
            *"origin-check"*) echo "ok: inside the installed artifact" ;;
            *) echo "::error::watch_skill resolved from outside the artifact: $origin"; exit 1 ;;
          esac
          workspace_real=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          case "$origin" in
            "$workspace_real"*) echo "::error::resolved from the source checkout"; exit 1 ;;
            *) echo "ok: not the source checkout" ;;
          esac
