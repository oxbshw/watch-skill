# Publish the twenty DeepWatch packages to npm.
#
# It cannot run by accident: the only trigger is a `deepwatch-v*` tag and there
# is no `workflow_dispatch`, so a release is a decision rather than a side
# effect of pushing something.
#
# **The `npm` Environment gate is a repository setting, not a fact this file
# can assert.** This header used to say the publish job "sits behind a protected
# `npm` Environment that a human has to approve". Naming an environment in a
# workflow does not protect it: GitHub creates one on first use with no rules
# at all, and on 2026-09-06 the repository had exactly one environment (`pypi`,
# with `protection_rules: []`) and no `npm` environment whatsoever. The approval
# gate exists only once somebody adds required reviewers at
# Settings → Environments. `release-workflow.test.mjs` can check that this file
# names the environment; nothing in this repository can check that GitHub is
# enforcing it.
#
# Watch Core releases on its own train, `core-v*`, in release.yml. They were one
# workflow on `v*` once, which meant a tag intended for one product built and
# published the other from whatever the tree happened to contain.
#
# **No token path exists.** npm verifies this workflow's OIDC identity against
# a Trusted Publisher configured once per package, at
# https://www.npmjs.com/package/<name>/access. There is deliberately no
# `NODE_AUTH_TOKEN` fallback: a fallback is what turns a misconfigured trusted
# publisher into a silent, unattested publish.
#
# **Nothing is published twice and nothing is published half-way.** Every
# version is checked against the registry before the first upload, the order is
# derived from the dependency graph so each version resolves the moment it is
# public, and a failure part-way through prints exactly what did and did not
# reach the registry.
#
# **A half-finished release is resumable, on one condition.** `publish-plan.mjs`
# asks the registry for the integrity of what it already holds and compares it
# with the tarball this run would upload. A version whose bytes match is
# skipped -- it is already done -- and a version that exists with *different*
# bytes stops the release outright. "Already published" and "already published
# from this build" are different questions, and only the second one makes a
# resume safe. See docs/releasing.md; an npm version cannot be republished, so
# where the plan refuses, the recovery is a new version and never a retry.
#
# **The publish job publishes what the verify job sealed.** It packs nothing.
# It downloads the sealed set, verifies it against the content-bound provenance
# manifest, and uploads those exact files.

name: release-deepwatch

on:
  push:
    tags: ["deepwatch-v*"]

# Read-only by default. `id-token: write` is granted to the publish job alone,
# because an OIDC token minted in a job that also runs project code is a token
# that project code can reach.
permissions:
  contents: read

concurrency:
  group: release-deepwatch-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: workspace

jobs:
  verify:
    name: Verify the tag and pack the artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dist-tag: ${{ steps.tag.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag must name the version the workspace declares
        id: tag
        run: |
          version="${GITHUB_REF_NAME#deepwatch-v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$version" != "$declared" ]; then
            echo "::error::${GITHUB_REF_NAME} does not name workspace version ${declared}."
            exit 1
          fi

          # A prerelease must never take `latest`. Somebody running
          # `npm i @deepwatch/cli` is asking for the version this project
          # stands behind, and a dist-tag is the only thing that answers.
          case "$version" in
            *-preview.*) tag=preview ;;
            *-rc.*)      tag=next ;;
            *-*)         echo "::error::${version} is a prerelease this train has no dist-tag for."; exit 1 ;;
            *)           tag=latest ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist-tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} to the ${tag} dist-tag."

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1
      - run: pnpm install --frozen-lockfile

      - name: Every gate, before anything is packed
        run: npm run check

      - name: Pack, and read what came out
        run: npm run pack

      - name: Install the tarballs into a clean project and run the CLI
        run: |
          npm run verify:packed
          npm run verify:packed-exec

      # Sealed here and nowhere else. The manifest binds this commit and tree
      # to a digest over every artifact, so the publish job can prove the
      # tarballs it received are the ones this job built rather than something
      # it produced itself. A candidate once shipped artifacts packed three
      # commits behind the accepted head and every gate passed, because every
      # gate compared `name@version` and both byte sets wore the same version.
      - name: Seal the packed set, and verify the seal
        run: |
          npm run release:seal
          node scripts/verify-provenance.mjs \
            --artifacts .release-artifacts \
            --manifest .release-artifacts-provenance.json \
            --expect-commit "$GITHUB_SHA"

      # A version already on the registry cannot be republished, so finding out
      # here is the difference between a refused release and a half-done one.
      #
      # `npm view` is asked about every package, and the answer decides one of
      # three things rather than two. A version nobody has published is
      # published. A version the registry holds *with these exact bytes* is
      # skipped, which is what makes a release that died at the fourteenth
      # package resumable at the fourteenth package. A version the registry
      # holds with different bytes stops everything: that release cannot be
      # completed at this version by anyone, and pretending otherwise ships a
      # scope whose halves came from different commits.
      - name: Plan what to publish, and refuse a version that is already spent
        run: |
          node scripts/publish-plan.mjs \
            --artifacts .release-artifacts \
            --out .release-artifacts/publish-plan.json
          cat .release-artifacts/publish-plan.json

      # Written here rather than in the release job, because this is the job
      # that has the tree, the manifest and the inventory. The release job
      # deliberately has only what it downloads.
      - name: Release notes, from the set that was actually sealed
        run: |
          node scripts/gen-release-notes.mjs \
            --artifacts .release-artifacts \
            --manifest .release-artifacts-provenance.json \
            --out .release-artifacts/release-notes.md
          cat .release-artifacts/release-notes.md

      # Staged into a directory whose name does not begin with a dot, and that
      # is not tidiness.
      #
      # `actions/upload-artifact` stopped including hidden files by default in
      # v4.4, and everything this release produces is hidden: the tarballs live
      # in `.release-artifacts/` and the manifest is
      # `.release-artifacts-provenance.json`. Uploaded by those paths the
      # archive matches nothing at all — and because `if-no-files-found: error`
      # is set, the job fails at the upload rather than at the mistake, on a
      # tag, which is the one run nobody wants to be debugging.
      #
      # `include-hidden-files: true` would also make it work and is the worse
      # fix: it opts the whole upload into hidden files, so a stray `.npmrc`
      # that ever appeared beside the tarballs would become a release asset.
      # Staging names exactly what ships.
      - name: Stage the release set where an artifact upload can see it
        run: |
          set -euo pipefail
          rm -rf release-upload
          mkdir -p release-upload
          cp .release-artifacts/*.tgz release-upload/
          cp .release-artifacts/SHA256SUMS release-upload/
          cp .release-artifacts/packed-artifacts.json release-upload/
          cp .release-artifacts/publish-plan.json release-upload/
          cp .release-artifacts/release-notes.md release-upload/
          # Renamed, not just moved. Copying it as `.release-artifacts-
          # provenance.json` would leave a hidden file inside a visible
          # directory, which the uploader excludes for exactly the same reason
          # it excluded the directory.
          cp .release-artifacts-provenance.json release-upload/provenance.json
          ls -la release-upload
          # Twenty tarballs and the five files that describe them.
          test "$(ls release-upload/*.tgz | wc -l)" -eq 20
          for required in SHA256SUMS packed-artifacts.json publish-plan.json \
                          release-notes.md provenance.json; do
            test -s "release-upload/$required" || {
              echo "::error::release-upload/$required is missing or empty"; exit 1; }
          done
          # Nothing hidden survives into the upload, because nothing hidden
          # would arrive at the other end.
          test -z "$(find release-upload -name '.*' -mindepth 1)"

      - uses: actions/upload-artifact@v7
        with:
          name: deepwatch-tarballs
          path: workspace/release-upload/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Declared so that a human approval *can* be required against this exact
    # tag. Whether one actually is depends on the repository's Environment
    # settings, not on this file -- see the header.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@deepwatch/cli
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # No `registry-url:` on purpose. It writes an .npmrc line reading a
      # token out of the environment, and an .npmrc shaped like that is the
      # thing that quietly publishes without provenance when OIDC is
      # misconfigured. The default registry is the one this publishes to.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      # Pinned, not `@latest`.
      #
      # Installing the newest npm on the day of the release let an unreviewed
      # toolchain into the one job that cannot be re-run: a change in packing,
      # in provenance, or in how a tarball is read would arrive unannounced, in
      # the step that spends twenty versions. This version is new enough for
      # trusted publishing, and moving it is a decision with a diff.
      - name: npm new enough for trusted publishing
        run: |
          npm install --global npm@11.17.0
          npm --version

      - uses: actions/download-artifact@v8
        with:
          name: deepwatch-tarballs
          path: workspace-artifacts

      - name: Put the sealed set back where the manifest describes it
        run: |
          set -euo pipefail
          rm -rf .release-artifacts
          mkdir -p .release-artifacts
          # The upload staged a flat, visible directory; the manifest describes
          # a hidden one. Restoring the shape here keeps every script that
          # reads `.release-artifacts` unchanged.
          cp ../workspace-artifacts/*.tgz .release-artifacts/
          cp ../workspace-artifacts/SHA256SUMS .release-artifacts/
          cp ../workspace-artifacts/packed-artifacts.json .release-artifacts/
          cp ../workspace-artifacts/publish-plan.json .release-artifacts/
          cp ../workspace-artifacts/release-notes.md .release-artifacts/
          cp ../workspace-artifacts/provenance.json .release-artifacts-provenance.json
          ls -l .release-artifacts
          test "$(ls .release-artifacts/*.tgz | wc -l)" -eq 20

      # The manifest is checked before the first upload, not after. A publish
      # job that trusts whatever arrived in an artifact is a publish job that
      # will eventually upload something nobody built -- and an npm version is
      # spent the instant that happens.
      - name: These are the bytes the verify job sealed
        run: |
          node scripts/verify-provenance.mjs \
            --artifacts .release-artifacts \
            --manifest .release-artifacts-provenance.json \
            --expect-commit "$GITHUB_SHA"

      # Re-planned against the registry rather than replayed from the artifact.
      # Between the two jobs sits a human approving an Environment, and the
      # only honest answer to "what is already published" is the one taken now.
      - name: Re-plan against the registry, at the moment of publishing
        run: |
          node scripts/publish-plan.mjs \
            --artifacts .release-artifacts \
            --out .release-artifacts/publish-plan.json

      # Dependency order, derived from the manifests. Each version resolves the
      # moment it is public, so nobody can install a package whose dependency
      # is still ten seconds away.
      - name: Publish in dependency order
        run: |
          set -u
          published=""
          skipped=""
          status=0
          for name in $(node scripts/publish-order.mjs); do
            action=$(node -e "
              const plan = require('./.release-artifacts/publish-plan.json');
              const entry = plan.entries.find(item => item.name === process.argv[1]);
              process.stdout.write(entry === undefined ? 'missing' : entry.action);
            " "$name")
            file=".release-artifacts/$(echo "${name#@}" | tr '/' '-')-${{ needs.verify.outputs.version }}.tgz"
            if [ "$action" = "skip" ]; then
              echo "Skipping ${name}: the registry already holds these exact bytes"
              skipped="${skipped} ${name}"
              continue
            fi
            if [ "$action" != "publish" ]; then
              echo "::error::${name}: the plan says ${action}."
              status=1
              break
            fi
            if [ ! -f "$file" ]; then
              echo "::error::${name}: ${file} was not packed."
              status=1
              break
            fi
            echo "Publishing ${name} to ${{ needs.verify.outputs.dist-tag }}"
            if npm publish "$file" --provenance --access public \
                 --tag "${{ needs.verify.outputs.dist-tag }}"; then
              published="${published} ${name}"
            else
              echo "::error::${name} failed to publish."
              status=1
              break
            fi
          done

          # A partial release is a fact about the registry, and it has to be
          # stated. Silence here is what leaves somebody guessing which half of
          # a scope is live.
          echo "### DeepWatch ${{ needs.verify.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "dist-tag: \`${{ needs.verify.outputs.dist-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$skipped" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Already on the registry with identical bytes, skipped:${skipped}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**This release is incomplete.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Published:${published:- nothing}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A published version cannot be replaced. Re-running this workflow is" >> "$GITHUB_STEP_SUMMARY"
            echo "safe: it re-plans against the registry and resumes at the first" >> "$GITHUB_STEP_SUMMARY"
            echo "package that is not already published from this exact build." >> "$GITHUB_STEP_SUMMARY"
            echo "See docs/releasing.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Published:${published:- nothing new}" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # A version-pinned smoke, on the platforms this distribution supports, and
  # only after the publish job succeeded. Pinned because "latest" is not the
  # claim being checked: the claim is that *this* version installs and runs.
  smoke:
    name: npx the published version
    needs: [verify, publish]
    # This job never checks out, so the workflow-wide
    # `defaults.run.working-directory: workspace` names a directory that is not
    # there and every `run` step below would die on `cd`. The checkout-free
    # shape is the point of the job -- somebody with nothing but node -- so the
    # working directory is corrected rather than the checkout added.
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      # No checkout. The point is that somebody with nothing but node can run
      # the published CLI, and a source tree on disk would weaken that.
      - name: The published CLI resolves and reports its own version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"

          # npm accepts a publish before every replica serves it.
          for attempt in $(seq 1 30); do
            if npm view "@deepwatch/cli@${version}" version >/dev/null 2>&1; then
              echo "@deepwatch/cli@${version} is on the registry (after ${attempt} check(s))"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::@deepwatch/cli@${version} never appeared on the registry."
              exit 1
            fi
            sleep 10
          done

          reported=$(npx --yes "@deepwatch/cli@${version}" --version)
          echo "reported: ${reported}"
          test "${reported}" = "${version}"

  # The announcement, after the thing it announces.
  #
  # This train had no release job at all. Twenty packages reached npm and the
  # tag that published them stayed a bare tag: no page to link, no downloadable
  # tarballs for anyone not installing from a registry, and — the one that
  # matters here — no home for the DSH bundle, which is the artifact somebody
  # with an existing Harness actually wants.
  #
  # It sits after `publish` and not after `smoke`, for the same reason Core's
  # does. Publication is the irreversible half; once twenty versions are live,
  # a Release that does not exist because one runner could not reach the
  # registry is a worse state than one that exists beside a red smoke. The
  # `report` job below states both.
  github-release:
    name: Complete the GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    # No checkout here either: this job publishes what it downloads. Same
    # correction as `smoke`.
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deepwatch-tarballs
          path: sealed

      # The same set, checked again on the way out. An asset attached to a
      # Release is what people download for years, and "it came from the right
      # artifact" is a claim a digest makes and a filename does not.
      # The same set, checked again on the way out, and checked against the
      # layout the upload actually produced. `download-artifact` unpacks the
      # staged directory's *contents*, so these files are directly under
      # `sealed/` -- not under the `workspace/.release-artifacts/` path the
      # verify job knew them by.
      - name: The assets are the sealed ones
        run: |
          set -euo pipefail
          ls -l sealed
          test "$(ls sealed/*.tgz | wc -l)" -eq 20
          cd sealed
          sha256sum -c SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: sealed/release-notes.md
          prerelease: ${{ needs.verify.outputs.dist-tag != 'latest' }}
          files: |
            sealed/*.tgz
            sealed/SHA256SUMS
            sealed/packed-artifacts.json
            sealed/publish-plan.json
            sealed/provenance.json

  # What actually happened, stated once, whatever the outcome. A release that
  # publishes twenty packages and then fails to announce them is a real state
  # somebody has to act on, and reading three job badges to reconstruct it is
  # how a partial release gets mistaken for a failed one.
  report:
    name: Report what reached which registry
    if: always()
    needs: [verify, publish, smoke, github-release]
    runs-on: ubuntu-latest
    # It only writes a summary, and it does that from no checkout at all.
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    steps:
      - name: Summarise
        env:
          VERIFY: ${{ needs.verify.result }}
          PUBLISH: ${{ needs.publish.result }}
          SMOKE: ${{ needs.smoke.result }}
          RELEASE: ${{ needs.github-release.result }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -uo pipefail
          {
            echo "### DeepWatch ${VERSION:-unknown} (${GITHUB_REF_NAME})"
            echo ""
            echo "| Stage | Result | Reversible |"
            echo "| --- | --- | --- |"
            echo "| Verify and seal | ${VERIFY} | yes |"
            echo "| npm | ${PUBLISH} | **no** |"
            echo "| Published smoke | ${SMOKE} | yes |"
            echo "| GitHub Release | ${RELEASE} | yes |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PUBLISH" = "success" ] && { [ "$SMOKE" != "success" ] || [ "$RELEASE" != "success" ]; }; then
            {
              echo "**This release is incomplete, and the irreversible half succeeded.**"
              echo ""
              echo "The twenty \`@deepwatch/*\` packages are on npm at ${VERSION}. An npm"
              echo "version can never be replaced, so do not re-run this workflow to"
              echo "\"finish\" it expecting a different publish: it re-plans against the"
              echo "registry and will correctly skip everything already published from"
              echo "this build. Recover the remaining stages on their own -- the Release"
              echo "from this run's sealed \`deepwatch-tarballs\` artifact."
              echo "See workspace/docs/releasing.md."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH" != "success" ]; then
            {
              echo "**Check the publish job before assuming nothing was published.**"
              echo ""
              echo "The publish step stops at the first failure and names what it had"
              echo "already uploaded. Everything after npm is gated on it, so no Release"
              echo "was created; re-running is safe and resumes at the first package"
              echo "that is not already published from this exact build."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The job's own result mirrors the release's, so a partial publish is
          # a red check rather than a green one with a note in it.
          [ "$VERIFY" = "success" ] && [ "$PUBLISH" = "success" ] \
            && [ "$SMOKE" = "success" ] && [ "$RELEASE" = "success" ]
