# Publish the twenty DeepWatch packages to npm.
#
# This has never run. It cannot run by accident either: the only trigger is a
# `deepwatch-v*` tag, there is no `workflow_dispatch`, and the publish job sits
# behind a protected `npm` Environment that a human has to approve. Those three
# together are the reason a release is a decision rather than a side effect of
# pushing something.
#
# Watch Core releases on its own train, `core-v*`, in release.yml. They were one
# workflow on `v*` once, which meant a tag intended for one product built and
# published the other from whatever the tree happened to contain.
#
# **No token path exists.** npm verifies this workflow's OIDC identity against
# a Trusted Publisher configured once per package, at
# https://www.npmjs.com/package/<name>/access. There is deliberately no
# `NODE_AUTH_TOKEN` fallback: a fallback is what turns a misconfigured trusted
# publisher into a silent, unattested publish.
#
# **Nothing is published twice and nothing is published half-way.** Every
# version is checked against the registry before the first upload, the order is
# derived from the dependency graph so each version resolves the moment it is
# public, and a failure part-way through prints exactly what did and did not
# reach the registry. See docs/releasing.md for what to do then; an npm version
# cannot be republished, so the recovery is always a new version, never a
# retry.

name: release-deepwatch

on:
  push:
    tags: ["deepwatch-v*"]

# Read-only by default. `id-token: write` is granted to the publish job alone,
# because an OIDC token minted in a job that also runs project code is a token
# that project code can reach.
permissions:
  contents: read

concurrency:
  group: release-deepwatch-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: workspace

jobs:
  verify:
    name: Verify the tag and pack the artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dist-tag: ${{ steps.tag.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag must name the version the workspace declares
        id: tag
        run: |
          version="${GITHUB_REF_NAME#deepwatch-v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$version" != "$declared" ]; then
            echo "::error::${GITHUB_REF_NAME} does not name workspace version ${declared}."
            exit 1
          fi

          # A prerelease must never take `latest`. Somebody running
          # `npm i @deepwatch/cli` is asking for the version this project
          # stands behind, and a dist-tag is the only thing that answers.
          case "$version" in
            *-preview.*) tag=preview ;;
            *-rc.*)      tag=next ;;
            *-*)         echo "::error::${version} is a prerelease this train has no dist-tag for."; exit 1 ;;
            *)           tag=latest ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist-tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} to the ${tag} dist-tag."

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1
      - run: pnpm install --frozen-lockfile

      - name: Every gate, before anything is packed
        run: npm run check

      - name: Pack, and read what came out
        run: npm run pack

      - name: Install the tarballs into a clean project and run the CLI
        run: |
          npm run verify:packed
          npm run verify:packed-exec

      # A version already on the registry cannot be republished, so finding out
      # here is the difference between a refused release and a half-done one.
      - name: Refuse if any version is already published
        run: |
          taken=0
          for name in $(node scripts/publish-order.mjs); do
            version="${{ steps.tag.outputs.version }}"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::error::${name}@${version} is already published."
              taken=1
            fi
          done
          [ "$taken" -eq 0 ] || exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: deepwatch-tarballs
          path: workspace/.release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # A protected Environment: a human approves, and the approval is recorded
    # against this exact tag.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@deepwatch/cli
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # No `registry-url:` on purpose. It writes an .npmrc line reading a
      # token out of the environment, and an .npmrc shaped like that is the
      # thing that quietly publishes without provenance when OIDC is
      # misconfigured. The default registry is the one this publishes to.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: npm new enough for trusted publishing
        run: |
          npm install --global npm@latest
          npm --version

      - uses: actions/download-artifact@v8
        with:
          name: deepwatch-tarballs
          path: workspace/.release-artifacts

      # Dependency order, derived from the manifests. Each version resolves the
      # moment it is public, so nobody can install a package whose dependency
      # is still ten seconds away.
      - name: Publish in dependency order
        run: |
          set -u
          published=""
          status=0
          for name in $(node scripts/publish-order.mjs); do
            file=".release-artifacts/$(echo "${name#@}" | tr '/' '-')-${{ needs.verify.outputs.version }}.tgz"
            if [ ! -f "$file" ]; then
              echo "::error::${name}: ${file} was not packed."
              status=1
              break
            fi
            echo "Publishing ${name} to ${{ needs.verify.outputs.dist-tag }}"
            if npm publish "$file" --provenance --access public \
                 --tag "${{ needs.verify.outputs.dist-tag }}"; then
              published="${published} ${name}"
            else
              echo "::error::${name} failed to publish."
              status=1
              break
            fi
          done

          # A partial release is a fact about the registry, and it has to be
          # stated. Silence here is what leaves somebody guessing which half of
          # a scope is live.
          echo "### DeepWatch ${{ needs.verify.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "dist-tag: \`${{ needs.verify.outputs.dist-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**This release is incomplete.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Published:${published:- nothing}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A published version cannot be replaced. See docs/releasing.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Published:${published}" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
